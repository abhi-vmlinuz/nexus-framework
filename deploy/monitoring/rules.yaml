# Recording rules consumed by dashboards and the export script.
# Kept separate from alerts.yaml (alerting) on purpose.
#
# Rules that depend on per-pod series arrive with phase T2; until then they
# simply produce no series, which Prometheus treats as normal.

groups:
  - name: nexus_recording
    interval: 30s
    rules:
      # VPN pool saturation, already used by alerts.
      - record: nexus:vpn_pool:ratio
        expr: nexus_vpn_ips_used / 1022

      # Session spawn tail latency at the 95th percentile.
      - record: nexus:spawn_latency_p95:5m
        expr: histogram_quantile(0.95, sum(rate(nexus_session_create_duration_seconds_bucket[5m])) by (le))

      # Slowest observed spawn latency during the event window.
      - record: nexus:spawn_latency_max:5m
        expr: histogram_quantile(0.99, sum(rate(nexus_session_create_duration_seconds_bucket[5m])) by (le))

      # Session creation outcome rate, by status.
      - record: nexus:session_create_rate:5m
        expr: sum by (status) (rate(nexus_session_create_total[5m]))

      # Reconciler self-heal rate.
      - record: nexus:reconcile_repair_rate:5m
        expr: rate(nexus_reconcile_repairs_total[5m])
