apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-prod-isolate
  namespace: nexus-challenges
  labels:
    managed-by: nexus
    mode: prod
spec:
  podSelector:
    matchLabels:
      app: nexus-challenge
  ingress:
    # Only allow traffic from the WireGuard VPN subnet. The host-level FORWARD
    # rules enforced by nexus-node-agent are the primary isolation; this
    # NetworkPolicy adds defense-in-depth.
    #
    # This MUST stay /22: the VPN pool is 10.8.0.0/22 (10.8.0.2 - 10.8.3.254),
    # as generated by setup.sh and documented in metrics.go. A /24 here would
    # silently cut off every peer outside 10.8.0.x.
    - from:
        - ipBlock:
            cidr: 10.8.0.0/22 # WireGuard VPN subnet
  egress:
    # Challenges may not reach the internet by default, and may not reach the
    # node or the cluster at all.
    #
    # This replaces the previous `egress: - {}` (allow all), which let a
    # compromised challenge pod reach Redis, the k3s API, the node's loopback
    # and the docker registry on the host network. Challenge pods are exactly
    # the code an attacker is invited to run, so egress is the wrong thing to
    # default to.
    #
    # DNS to kube-system first: without it a pod cannot resolve anything and
    # every tool that needs a hostname fails for a reason that looks like the
    # challenge's fault.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Same-selector egress: a multi-container challenge pack has to talk to its
    # own sidecars. Without this a pack's second container cannot reach the
    # first and the challenge looks broken for reasons no participant can see.
    - to:
        - podSelector:
            matchLabels:
              app: nexus-challenge
      ports:
        - protocol: TCP
        - protocol: UDP
  policyTypes:
    - Ingress
    - Egress

---
# AttackBox pods (nexus-role=env) get internet by default, challenge pods do
# not. NetworkPolicies are additive, so this only widens the env pods — the
# prod policy above stays default-deny for anything without the label.
#
# Applied from the same file, before or after nexus-prod-isolate, with:
#   k3s kubectl apply -f deploy/network-policy-prod.yaml
#
# Blocking on someone to own a "browser needs outbound internet" rule for
# event mode, and on permission-granting: today only the space of "give
# everyone internet" exists, not "grant this one challenge internet".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-env-internet
  namespace: nexus-challenges
  labels:
    managed-by: nexus
spec:
  podSelector:
    matchLabels:
      app: nexus-challenge
      nexus-role: env
  egress:
    - {}
  policyTypes:
    - Egress